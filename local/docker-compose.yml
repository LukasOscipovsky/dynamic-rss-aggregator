version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rss_postgres
    environment:
      POSTGRES_USER: rss
      POSTGRES_PASSWORD: rsspass
      POSTGRES_DB: rssdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

